name: iconify_sdk
resolution: workspace
description: >
  The Flutter package for Iconify icons. Render any icon from 200+
  open-source icon sets with a single widget. Works offline with bundled starter registry.
version: 1.1.0
repository: https://github.com/ampslabs/iconify/tree/main/packages/iconify_sdk
issue_tracker: https://github.com/ampslabs/iconify/issues
homepage: https://github.com/ampslabs/iconify

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.38.0'

dependencies:
  flutter:
    sdk: flutter
  iconify_sdk_core: ^1.1.0
  flutter_svg: ^2.3.0
  meta: ^1.15.0
  path: ^1.9.0
  vector_graphics: ^1.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^6.1.0
  mocktail: ^1.0.5
  alchemist: ^0.14.0

flutter:
  uses-material-design: true
  assets:
    - assets/iconify/used_icons.json
    - assets/iconify/starter/
